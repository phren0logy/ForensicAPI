[project]
name = "forensicapi"
version = "2.0.0"
description = "Document anonymization and processing for AI assistants"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [
    {name = "ForensicAPI Contributors", email = "nanton@stanford.edu"}
]
keywords = [
    "mcp",
    "anonymization",
    "pii",
    "document-processing",
    "privacy",
    "ai-assistant",
    "claude",
    "pdf-extraction",
    "docling",
    "azure-document-intelligence"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: General",
    "Topic :: Security",
    "Operating System :: OS Independent",
]

dependencies = [
    "aiohttp>=3.12.13",
    "azure-ai-documentintelligence>=1.0.2",
    "fastapi>=0.115.12",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "logging>=0.4.9.6",
    "psutil>=7.0.0",
    "pypdf>=5.6.0",
    "pytest>=8.4.0",
    "python-dotenv>=1.1.0",
    "python-multipart>=0.0.20",
    "tiktoken>=0.9.0",
    "uvicorn>=0.34.3",
    "transformers>=4.36.0",
    "torch>=2.1.0",
    "faker>=20.1.0",
    "pip>=25.1.1",
    "python-dateutil>=2.9.0.post0",
    "llm-guard>=0.3.16",
    "docling>=2.39.0",
    "ocrmac>=1.0.0",
    "docling-core[chunking-openai]>=2.39.0",
    "fastmcp>=2.11.2",
]

[project.urls]
Homepage = "https://github.com/phren0logy/forensicapi"
Repository = "https://github.com/phren0logy/forensicapi"
Documentation = "https://github.com/phren0logy/forensicapi/blob/main/README.md"
"Issue Tracker" = "https://github.com/phren0logy/forensicapi/issues"

[dependency-groups]
dev = [
    "pytest-asyncio>=1.0.0",
    "reportlab>=4.4.2",
]

[project.scripts]
forensicapi = "forensicapi.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = [
    "forensicapi/**",
    "routes/**",
    "services/**",
    "utils/**",
    "README.md",
    "LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
